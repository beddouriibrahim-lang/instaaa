<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Votre tableau de bord — Audience</title>
<style>
:root{--pink:#c900c7;--ink:#111216;--muted:#666c75;--track:#eff0f4;--line:#dfe1e6}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{max-width:760px;margin:0 auto}.top{height:106px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:14px}
.back,.actions{border:1px solid #d7d8dc;background:white;border-radius:60px;height:82px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #00000008}
.back{width:92px;flex:none}.actions{width:207px;gap:32px}.title{font-size:34px;font-weight:700;white-space:nowrap;letter-spacing:-.6px;flex:1}
svg{display:block}.tabs{height:85px;display:flex;align-items:stretch;border-bottom:1px solid #eceef1;white-space:nowrap;overflow:hidden}
.tab{font-size:28px;font-weight:650;color:#626873;padding:0 20px;display:flex;align-items:center;justify-content:center;position:relative;flex:1}
.tab.active{color:var(--ink)}.tab.active:after{content:"";position:absolute;bottom:0;left:8px;right:8px;height:4px;background:#15161a}
main{padding:0 21px 42px}.group{padding-top:0}.row{margin-top:0;height:92px;display:flex;align-items:center;gap:24px}.row-content{flex:1;min-width:0}.label{font-size:28px;line-height:1.2;margin-bottom:16px}.barline{display:flex;align-items:center;gap:26px}.track{height:16px;border-radius:5px;background:var(--track);flex:1;overflow:hidden;position:relative}.fill{height:100%;min-width:3px;border-radius:5px;background:var(--pink);transition:width .18s ease}.value{font-size:29px;font-weight:700;min-width:104px;text-align:right;white-space:nowrap}
.edit-name,.edit-value{outline:none;border:0;background:transparent;color:inherit;font:inherit;padding:0;border-radius:4px;min-width:1ch}.edit-name:focus,.edit-value:focus{background:#fff8ff;box-shadow:0 0 0 2px #eeb7ee}.edit-value{font-size:inherit;font-weight:inherit;text-align:right;width:88px}.section-title{margin:73px 0 23px;font-size:32px;line-height:1.2;font-weight:750;display:flex;gap:14px;align-items:center}
.pills{display:flex;gap:15px;margin-bottom:39px}.pill{height:82px;padding:0 25px;border:2px solid var(--line);border-radius:48px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:650;background:#fff}.pill.selected{background:#f0f0f4;border-color:#f0f0f4}
.countries .row{height:92px}.countries .label{margin-bottom:15px}.hint{font-size:13px;color:#8a8e96;text-align:center;padding:10px 0 0}.edit-name:focus::selection,.edit-value:focus::selection{background:#eeb7ee}
@media(max-width:500px){.top{height:58px;padding:0 10px;gap:7px}.back{height:48px;width:49px}.back svg{width:25px;height:32px}.actions{height:48px;width:116px;gap:16px}.actions svg{width:26px;height:30px}.title{font-size:19px;letter-spacing:-.4px;white-space:nowrap}.tabs{height:55px}.tab{font-size:16px;padding:0 7px}.tab.active:after{height:3px;left:5px;right:5px}main{padding:0 11px 24px}.row{height:50px;gap:8px}.label{font-size:16px;margin-bottom:8px}.track{height:9px}.barline{gap:12px}.value{font-size:17px;min-width:51px}.edit-value{width:48px}.section-title{font-size:18px;margin:45px 0 13px;gap:8px}.section-title svg{width:20px;height:20px}.pills{gap:8px;margin-bottom:26px}.pill{height:44px;padding:0 14px;font-size:16px}.countries .row{height:50px}.hint{font-size:11px}}
</style>
</head>
<body>
<header class="top">
  <button class="back" aria-label="Retour"><svg width="38" height="48" viewBox="0 0 38 48" fill="none"><path d="M27 5 8 24l19 19" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="title">Votre tableau de bord</div>
  <div class="actions"><svg width="34" height="42" viewBox="0 0 34 42" fill="none"><path d="M17 27V3m0 0L7 13m10-10 10 10M4 23v13a3 3 0 0 0 3 3h20a3 3 0 0 0 3-3V23" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="42" height="42" viewBox="0 0 42 42" fill="none"><circle cx="21" cy="21" r="18" stroke="#111" stroke-width="3.5"/><path d="M21 19v11m0-18h.02" stroke="#111" stroke-width="3.5" stroke-linecap="round"/></svg></div>
</header>
<nav class="tabs"><div class="tab">Accueil</div><div class="tab">Performance</div><div class="tab">Contenu</div><div class="tab active">Audience</div></nav>
<main>
<section class="group" id="ages"></section>
<h2 class="section-title">Lieux principaux <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="12.5" stroke="#111" stroke-width="2.6"/><path d="M15 13v8m0-13h.02" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg></h2>
<div class="pills"><button class="pill selected">Pays</button><button class="pill">Villes</button></div>
<section class="group countries" id="countries"></section>
<div class="hint">Tape sur un nom ou un pourcentage pour le modifier.</div>
</main>
<script>
const ageData=[['45-54',8],['55-64',2.8],['65+',1.7]];
const countryData=[['Maroc',69.1],['Algérie',12.7],['Tunisie',2.1],['Espagne',1.5],['France',1.4]];
function fmt(n){return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}
function makeRow([name,pct]){const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="row-content"><div class="label"><span class="edit-name" contenteditable="true" spellcheck="false">${name}</span></div><div class="barline"><div class="track"><div class="fill"></div></div><div class="value"><input class="edit-value" type="text" inputmode="decimal" aria-label="Pourcentage" value="${fmt(pct)}"></div></div></div>`;const input=row.querySelector('input'),fill=row.querySelector('.fill');function update(){let x=parseFloat(input.value.replace('%','').replace(',','.'));if(!Number.isFinite(x))x=0;x=Math.max(0,Math.min(100,x));fill.style.width=x+'%'}input.addEventListener('input',update);input.addEventListener('blur',()=>{let x=parseFloat(input.value.replace('%','').replace(',','.'));if(Number.isFinite(x)){x=Math.max(0,Math.min(100,x));input.value=fmt(x)}update()});update();return row}
for(const d of ageData)document.querySelector('#ages').append(makeRow(d));for(const d of countryData)document.querySelector('#countries').append(makeRow(d));
</script>
</body>
</html>
